# /etc/nginx/sites-available/ticketing.alita.id  (lalu symlink ke sites-enabled)
# HTTPS diterminasi di WAF Sophos; WAF meneruskan ke server ini lewat HTTP port 80.
# Jika WAF meneruskan lewat HTTPS, tambahkan "listen 443 ssl;" + ssl_certificate server ini.
server {
    listen 80;
    server_name ticketing.alita.id;

    root /var/www/ticketing/current/public;
    index index.php;
    charset utf-8;

    # Lampiran maksimal 5 MB + isi form.
    client_max_body_size 8m;

    access_log /var/log/nginx/ticketing.access.log;
    error_log  /var/log/nginx/ticketing.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # CSS/JS diberi ?v=<commit> oleh aplikasi, jadi aman di-cache lama.
    location ~* ^/(css|js)/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # $realpath_root: path rilis nyata di balik symlink "current", agar opcache ikut pindah saat deploy.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
