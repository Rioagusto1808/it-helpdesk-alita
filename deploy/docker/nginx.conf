# HTTP server (Port 80 di container / Port 8088 di host)
server {
    listen 80;
    server_name ticketing.alita.id localhost;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Maximum file upload size 12MB
    client_max_body_size 12M;

    # Static assets caching
    location ~* ^/(css|js)/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# HTTPS server (Port 443 di container / Port 8443 di host)
server {
    listen 443 ssl;
    server_name ticketing.alita.id localhost;

    ssl_certificate /etc/nginx/certs/ticketing.alita.id.crt;
    ssl_certificate_key /etc/nginx/certs/ticketing.alita.id.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Maximum file upload size 12MB
    client_max_body_size 12M;

    # Static assets caching
    location ~* ^/(css|js)/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
