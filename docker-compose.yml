services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketing_app
    restart: always
    env_file: .env
    volumes:
      - ticketing_storage:/var/www/html/storage
    networks:
      - ticketing_net
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: ticketing_web
    restart: always
    ports:
      - "0.0.0.0:8088:80"
    volumes:
      - .:/var/www/html:ro
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ticketing_net
    depends_on:
      - app

  db:
    image: postgres:17-alpine
    container_name: ticketing_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-alita_helpdesk}
      POSTGRES_USER: ${DB_USERNAME:-alita}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ticketing_pgdata:/var/lib/postgresql/data
    networks:
      - ticketing_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-alita} -d ${DB_DATABASE:-alita_helpdesk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketing_queue
    restart: always
    command: php artisan queue:work --tries=3 --backoff=60 --sleep=3 --max-time=3600
    env_file: .env
    volumes:
      - ticketing_storage:/var/www/html/storage
    networks:
      - ticketing_net
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketing_scheduler
    restart: always
    command: php artisan schedule:work
    env_file: .env
    volumes:
      - ticketing_storage:/var/www/html/storage
    networks:
      - ticketing_net
    depends_on:
      db:
        condition: service_healthy

networks:
  ticketing_net:
    name: ticketing_net

volumes:
  ticketing_pgdata:
    name: ticketing_pgdata
  ticketing_storage:
    name: ticketing_storage
